  <style>
:root {
  color-scheme: dark;
  font-family: 'Space Grotesk', system-ui, sans-serif;

* { box-sizing: border-box; }
body { margin: 0; min-width: 320px; background: radial-gradient(circle at 82% 0%, #1b203f 0, transparent 30rem), var(--bg); color: var(--text); }
button, select, textarea, input { font: inherit; }
button { cursor: pointer; }

.settings-modal { width: min(540px, 100%); padding: 25px; border: 1px solid rgba(114,230,219,.22); border-radius: 18px; background: #101727; box-shadow: 0 20px 80px rgba(0,0,0,.4); }

.startup-error-mark { display: grid; place-items: center; width: 48px; height: 48px; border: 1px solid rgba(255,117,117,.45); border-radius: 14px; color: #ffadad; font-size: 24px; }
.startup-error h1 { font-size: 28px; letter-spacing: -.05em; }
.startup-error p:not(.eyebrow) { color: var(--muted); line-height: 1.6; }
.startup-error pre { max-height: 160px; overflow: auto; margin: 8px 0; padding: 14px; border: 1px solid var(--line); border-radius: 9px; color: #ffadad; background: #1a101b; white-space: pre-wrap; word-break: break-word; }

@media (max-width: 760px) {
  .shell { padding-top: 18px; }
  .content { padding-top: 38px; }
  .hero { min-height: auto; }
  .hero-orbit { position: absolute; right: -58px; top: -12px; transform: scale(.75); opacity: .62; }
  .hero-copy { max-width: 75%; font-size: 13px; }
  .controls-grid { grid-template-columns: 1fr 1fr; }
  .code-layout { grid-template-columns: 1fr; }
  .file-list { display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .file-item { flex: 0 0 auto; width: auto; margin: 0 4px 0 0; }
  .result-heading { display: block; }
  .result-badge { display: inline-block; margin-top: 14px; }
}
@media (max-width: 460px) {
  .topbar { padding-bottom: 18px; }
  .status-pill { display: none; }
  .hero h2 { font-size: 45px; }
  .hero-copy { max-width: 100%; }
  .composer-card, .result-section, .history-section { padding: 18px; }
  .controls-grid { grid-template-columns: 1fr; }
  .section-label .muted { display: none; }
  .result-actions { flex-direction: column-reverse; align-items: stretch; }
  .footer { gap: 10px; flex-direction: column; }
}

  <script>
const SETTINGS_KEY = 'code-mobile-settings-v1';

const PROVIDERS = {
  openai: {
    label: 'OpenAI',
    hint: 'Responses API',
    defaultModel: 'gpt-6.1-sol',
    models: ['gpt-6.1-sol', 'gpt-6-luna', 'gpt-6-astra'],
  },
  gemini: {
    label: 'Google Gemini',
    hint: 'Interactions API',
    defaultModel: 'gemini-4-argon',
    models: ['gemini-4-argon', 'gemini-3.8-flash', 'gemini-3.5-flash-lite'],
  },
  claude: {
    label: 'Anthropic Claude',
    hint: 'Messages API',
    defaultModel: 'claude-opus-5-5',
    models: ['claude-opus-5-5', 'claude-sonnet-5-5', 'claude-haiku-5-5'],
  },
};

const LANGUAGES = [
  { value: 'html', label: 'HTML', extension: 'html' },
  { value: 'css', label: 'CSS', extension: 'css' },
  { value: 'javascript', label: 'JavaScript', extension: 'js' },
  { value: 'typescript', label: 'TypeScript', extension: 'ts' },
  { value: 'react', label: 'React / JSX', extension: 'jsx' },
  { value: 'vue', label: 'Vue', extension: 'vue' },
  { value: 'angular', label: 'Angular', extension: 'ts' },
  { value: 'svelte', label: 'Svelte', extension: 'svelte' },
  { value: 'python', label: 'Python', extension: 'py' },
  { value: 'java', label: 'Java', extension: 'java' },
  { value: 'kotlin', label: 'Kotlin', extension: 'kt' },
  { value: 'swift', label: 'Swift', extension: 'swift' },
  { value: 'c', label: 'C', extension: 'c' },
  { value: 'cpp', label: 'C++', extension: 'cpp' },
  { value: 'csharp', label: 'C#', extension: 'cs' },
  { value: 'go', label: 'Go', extension: 'go' },
  { value: 'rust', label: 'Rust', extension: 'rs' },
  { value: 'php', label: 'PHP', extension: 'php' },
  { value: 'ruby', label: 'Ruby', extension: 'rb' },
  { value: 'dart', label: 'Dart', extension: 'dart' },
  { value: 'sql', label: 'SQL', extension: 'sql' },
  { value: 'json', label: 'JSON', extension: 'json' },
  { value: 'xml', label: 'XML', extension: 'xml' },
  { value: 'yaml', label: 'YAML', extension: 'yml' },
  { value: 'markdown', label: 'Markdown', extension: 'md' },
  { value: 'bash', label: 'Bash', extension: 'sh' },
  { value: 'powershell', label: 'PowerShell', extension: 'ps1' },
  { value: 'dockerfile', label: 'Dockerfile', extension: 'dockerfile' },
  { value: 'node', label: 'Node.js / Express', extension: 'js' },
  { value: 'solidity', label: 'Solidity', extension: 'sol' },
  { value: 'r', label: 'R', extension: 'r' },
  { value: 'graphql', label: 'GraphQL', extension: 'graphql' },
  { value: 'ini', label: 'INI / Config', extension: 'ini' },
];

function getSettings() {
  const defaults = {
    provider: 'openai',
    model: PROVIDERS.openai.defaultModel,
    language: 'html',
    outputType: 'project',
    apiKeys: { openai: '', gemini: '', claude: '' },
  };
  try {
    const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
    const merged = {
      ...defaults,
      ...saved,
      apiKeys: { ...defaults.apiKeys, ...(saved.apiKeys || {}) },
    };
    if (!PROVIDERS[merged.provider]) merged.provider = defaults.provider;
    if (!PROVIDERS[merged.provider].models.includes(merged.model)) merged.model = PROVIDERS[merged.provider].defaultModel;
    if (!LANGUAGES.some((item) => item.value === merged.language)) merged.language = defaults.language;
    if (!['project', 'single'].includes(merged.outputType)) merged.outputType = defaults.outputType;
    return merged;
  } catch {
    return defaults;
  }
}

function saveSettings(settings) {
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
}

function buildPrompt({ instruction, language, outputType }) {
  const languageLabel = LANGUAGES.find((item) => item.value === language)?.label || language;
  const projectRule = outputType === 'project'
    ? 'Devuelve un proyecto compuesto por los archivos necesarios.'
    : 'Devuelve un único archivo autocontenido.';

  return `Eres un generador de código preciso. Convierte la instrucción del usuario en código ejecutable y claro.

Lenguaje o formato: ${languageLabel}
Tipo de salida: ${projectRule}
Instrucción del usuario: ${instruction}

Responde ÚNICAMENTE con JSON válido, sin markdown, con esta forma exacta:
{
  "title": "título corto",
  "summary": "resumen en español",
  "files": [
    { "name": "archivo.ext", "language": "${language}", "code": "contenido completo del archivo" }
  ],
  "warnings": ["advertencia opcional"]
}
No omitas archivos necesarios. Escapa correctamente saltos de línea y comillas dentro de los valores JSON.`;
}

function parseJsonResponse(text, language) {
  const cleaned = String(text || '').trim().replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '');
  try {
    const parsed = JSON.parse(cleaned);
    if (Array.isArray(parsed.files) && parsed.files.length) return parsed;
  } catch {
    // Some models wrap the JSON in a short explanation. Try to locate the object.
  }
  const start = cleaned.indexOf('{');
  const end = cleaned.lastIndexOf('}');
  if (start >= 0 && end > start) {
    try {
      const parsed = JSON.parse(cleaned.slice(start, end + 1));
      if (Array.isArray(parsed.files) && parsed.files.length) return parsed;
    } catch {
      // Fall through to a single-file response.
    }
  }
  const item = LANGUAGES.find((entry) => entry.value === language) || LANGUAGES[0];
  return {
    title: 'Código generado',
    summary: 'La respuesta llegó como un archivo único.',
    files: [{ name: `generated.${item.extension}`, language, code: cleaned }],
    warnings: ['El proveedor no devolvió JSON estructurado; se conservó el texto completo.'],
  };
}

async function callOpenAI(model, prompt, apiKey) {
  const response = await fetch('https://api.openai.com/v1/responses', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${apiKey}` },
    body: JSON.stringify({ model, input: prompt, temperature: 0.2 }),
  });
  const data = await response.json();
  if (!response.ok) throw new Error(data?.error?.message || 'OpenAI rechazó la solicitud.');
  return data.output_text || data.output?.flatMap((item) => item.content || []).map((part) => part.text || '').join('') || '';
}

async function callGemini(model, prompt, apiKey) {
  const response = await fetch('https://generativelanguage.googleapis.com/v1beta/interactions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
    body: JSON.stringify({ model, input: prompt }),
  });
  const data = await response.json();
  if (!response.ok) throw new Error(data?.error?.message || 'Gemini rechazó la solicitud.');
  return data.output_text || data.output?.flatMap((item) => item.content || []).map((part) => part.text || '').join('') || '';
}

async function callClaude(model, prompt, apiKey) {
  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({ model, max_tokens: 12000, temperature: 0.2, messages: [{ role: 'user', content: prompt }] }),
  });
  const data = await response.json();
  if (!response.ok) throw new Error(data?.error?.message || 'Claude rechazó la solicitud.');
  return data.content?.filter((block) => block.type === 'text').map((block) => block.text).join('') || '';
}

function hasApiKey(settings) {
  return Boolean(settings.apiKeys?.[settings.provider]?.trim());
}

async function generateCode({ instruction, language, outputType, settings }) {
  const apiKey = settings.apiKeys?.[settings.provider]?.trim();
  if (!apiKey) return generateDemo({ instruction, language, outputType });

  const prompt = buildPrompt({ instruction, language, outputType });
  let raw;
  if (settings.provider === 'openai') raw = await callOpenAI(settings.model, prompt, apiKey);
  if (settings.provider === 'gemini') raw = await callGemini(settings.model, prompt, apiKey);
  if (settings.provider === 'claude') raw = await callClaude(settings.model, prompt, apiKey);
  if (!raw) throw new Error('El proveedor devolvió una respuesta vacía.');
  return { ...parseJsonResponse(raw, language), provider: PROVIDERS[settings.provider].label, model: settings.model, demo: false };
}

function generateDemo({ instruction, language, outputType }) {
  const safeText = instruction.replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const samples = {
    html: `<!doctype html>\n<html lang="es">\n  <head>\n    <meta charset="UTF-8" />\n    <title>Resultado</title>\n  </head>\n  <body>\n    <main class="app">\n      <h1>${safeText}</h1>\n      <p>Configura una API para generar una implementación real.</p>\n    </main>\n  </body>\n</html>`,
    css: `.app {\n  max-width: 720px;\n  margin: 0 auto;\n  padding: 2rem;\n  color: #e5e7eb;\n  background: #111827;\n  border-radius: 1rem;\n}`,
    javascript: `const request = ${JSON.stringify(instruction)};\n\nfunction run() {\n  console.log('Solicitud:', request);\n}\n\nrun();`,
    python: `def main():\n    request = ${JSON.stringify(instruction)}\n    print(f"Solicitud: {request}")\n\nif __name__ == "__main__":\n    main()`,
    json: JSON.stringify({ request: instruction, note: 'Configura una API para completar la generación.' }, null, 2),
    sql: `CREATE TABLE generated_requests (\n  id INTEGER PRIMARY KEY,\n  instruction TEXT NOT NULL,\n  created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP\n);`,
  };
  const item = LANGUAGES.find((entry) => entry.value === language) || LANGUAGES[0];
  const code = samples[language] || `// Modo demo — ${item.label}\n// Solicitud: ${instruction}\n\n// Configura una clave API para generar código real.`;
  return {
    title: 'Borrador de demostración',
    summary: `Vista previa local para ${item.label}. La instrucción fue recibida correctamente.`,
    files: [{ name: `generated.${item.extension}`, language, code }],
    warnings: ['Modo demo activo: agrega una clave API en Configuración para usar IA real.'],
    provider: 'Modo demo',
    model: 'local-template',
    demo: true,
  };
}


const HISTORY_KEY = 'code-mobile-history-v1';
let settings = getSettings();
let history = readHistory();
let currentResult = null;
let activeFileIndex = 0;

const app = document.querySelector('#app');

function showStartupError(error) {
  if (!app) return;
  const message = error instanceof Error ? error.message : String(error);
  app.innerHTML = `<main class="startup-error"><div class="startup-error-mark">!</div><p class="eyebrow">CODE MOBILE</p><h1>No se pudo cargar la interfaz</h1><p>El APK abrió correctamente, pero el WebView encontró un error al iniciar. Sin conexión a una API todavía puedes usar la app en modo demo.</p><pre>${escapeHtml(message)}</pre><button id="reload-app" class="generate-button">Recargar aplicación</button></main>`;
  document.querySelector('#reload-app')?.addEventListener('click', () => window.location.reload());
}

function escapeHtml(value = '') {
  return String(value).replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[char]);
}

function readHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch { return []; }
}

function persistHistory() {
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(0, 20)));
}

function languageOptions(selected) {
  return LANGUAGES.map((item) => `<option value="${item.value}" ${item.value === selected ? 'selected' : ''}>${item.label}</option>`).join('');
}

function providerOptions(selected) {
  return Object.entries(PROVIDERS).map(([value, item]) => `<option value="${value}" ${value === selected ? 'selected' : ''}>${item.label}</option>`).join('');
}

function modelOptions(provider, selected) {
  return PROVIDERS[provider].models.map((model) => `<option value="${model}" ${model === selected ? 'selected' : ''}>${model}</option>`).join('');
}

function render() {
  const activeFile = currentResult?.files?.[activeFileIndex];
  if (!app) throw new Error('No existe el contenedor #app en index.html');
  app.innerHTML = `
    <div class="shell">
      <header class="topbar">
        <div class="brand-lockup">
          <div class="brand-mark"><span>&lt;/&gt;</span></div>
          <div><p class="eyebrow">PERSONAL WORKSPACE</p><h1>Code Mobile</h1></div>
        </div>
        <div class="top-actions">
          <span class="status-pill"><i></i>${hasApiKey(settings) ? 'IA conectada' : 'Modo demo'}</span>
          <button class="icon-button" id="settings-button" aria-label="Abrir configuración">⚙</button>
        </div>
      </header>

      <main class="content">
        <section class="hero">
          <div>
            <p class="kicker">Escribe. Elige. Genera.</p>
            <h2>Convierte una idea<br /><em>en código.</em></h2>
            <p class="hero-copy">Describe lo que necesitas con palabras simples. La app prepara el resultado en el lenguaje que elijas.</p>
          </div>
          <div class="hero-orbit" aria-hidden="true"><span>JS</span><span>PY</span><span>SQL</span><b>AI</b></div>
        </section>

        <section class="composer-card">
          <div class="section-label"><span class="number">01</span><span>Tu instrucción</span><span class="line"></span><span class="muted">Natural language</span></div>
          <textarea id="instruction" placeholder="Ej.: crea una página de inicio con un botón azul y un formulario de contacto...">${escapeHtml(document.querySelector('#instruction')?.value || '')}</textarea>
          <div class="suggestions">
            <button class="chip" data-prompt="Crea una landing page moderna para una aplicación móvil">landing page</button>
            <button class="chip" data-prompt="Crea una API REST para gestionar productos">API REST</button>
            <button class="chip" data-prompt="Crea una tabla SQL de usuarios y pedidos">tabla SQL</button>
          </div>
        </section>

        <section class="controls-grid">
          <div class="control-card"><label for="provider">Proveedor</label><select id="provider">${providerOptions(settings.provider)}</select><small>${PROVIDERS[settings.provider].hint}</small></div>
          <div class="control-card"><label for="model">Modelo</label><select id="model">${modelOptions(settings.provider, settings.model)}</select><small>Se puede cambiar en Configuración</small></div>
          <div class="control-card"><label for="language">Lenguaje / formato</label><select id="language">${languageOptions(settings.language)}</select><small id="language-count">${LANGUAGES.length} opciones disponibles</small></div>
          <div class="control-card"><label for="output-type">Tipo de salida</label><select id="output-type"><option value="project" ${settings.outputType === 'project' ? 'selected' : ''}>Proyecto / varios archivos</option><option value="single" ${settings.outputType === 'single' ? 'selected' : ''}>Archivo único</option></select><small>Se guarda en tu dispositivo</small></div>
        </section>

        <button class="generate-button" id="generate-button"><span class="spark">✦</span><span>Generar código</span><span class="shortcut">⌘ ↵</span></button>

        ${renderResult(activeFile)}
        ${renderHistory()}
      </main>

      <footer class="footer"><span>Code Mobile <b>v1.0</b></span><span>Local-first · Capacitor ready</span></footer>
    </div>
    ${renderSettingsModal()}
    <div class="toast" id="toast" role="status"></div>
  `;
  bindEvents();
}

function renderResult(activeFile) {
  if (!currentResult) {
    return `<section class="empty-result"><div class="empty-icon">{ }</div><div><h3>Tu código aparecerá aquí</h3><p>Elige una instrucción y pulsa generar para comenzar.</p></div></section>`;
  }
  return `<section class="result-section">
    <div class="result-heading"><div><div class="section-label"><span class="number">02</span><span>Resultado</span><span class="line"></span><span class="muted">${escapeHtml(currentResult.provider)} · ${escapeHtml(currentResult.model)}</span></div><h3>${escapeHtml(currentResult.title)}</h3><p>${escapeHtml(currentResult.summary)}</p></div><span class="result-badge ${currentResult.demo ? 'demo' : ''}">${currentResult.demo ? 'DEMO LOCAL' : 'GENERADO'}</span></div>
    ${currentResult.warnings?.length ? `<div class="warning">⚠ ${escapeHtml(currentResult.warnings[0])}</div>` : ''}
    <div class="code-layout">
      <nav class="file-list">${currentResult.files.map((file, index) => `<button class="file-item ${index === activeFileIndex ? 'active' : ''}" data-file-index="${index}"><span class="file-icon">${file.name.split('.').pop().toUpperCase().slice(0, 3)}</span><span>${escapeHtml(file.name)}</span></button>`).join('')}</nav>
      <div class="code-panel"><div class="code-toolbar"><span>${escapeHtml(activeFile?.name || '')}</span><div><button class="tool-button" id="copy-button">Copiar</button><button class="tool-button" id="download-button">Descargar</button></div></div><pre><code>${escapeHtml(activeFile?.code || '')}</code></pre></div>
    </div>
    <div class="result-actions"><button class="secondary-button" id="export-button">Exportar proyecto JSON</button><button class="secondary-button" id="new-button">Nueva generación</button></div>
  </section>`;
}

function renderHistory() {
  if (!history.length) return '';
  return `<section class="history-section"><div class="section-label"><span class="number">03</span><span>Historial local</span><span class="line"></span><span class="muted">${history.length}/20</span></div><div class="history-list">${history.slice(0, 5).map((item, index) => `<button class="history-item" data-history-index="${index}"><span class="history-dot"></span><span class="history-copy"><strong>${escapeHtml(item.title)}</strong><small>${escapeHtml(item.instruction)}</small></span><span class="history-meta">${escapeHtml(item.languageLabel)}</span><span class="history-arrow">↗</span></button>`).join('')}</div></section>`;
}

function renderSettingsModal() {
  return `<div class="modal-backdrop" id="settings-modal" hidden><div class="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title"><div class="modal-header"><div><p class="eyebrow">LOCAL ONLY</p><h2 id="settings-title">Configuración</h2></div><button class="icon-button" id="close-settings">×</button></div><p class="modal-copy">Tus credenciales se guardan en el almacenamiento local de este dispositivo. No se envían a ningún servidor propio.</p><label class="modal-label">Proveedor activo<select id="settings-provider">${providerOptions(settings.provider)}</select></label><div class="key-grid">${Object.entries(PROVIDERS).map(([key, item]) => `<label class="modal-label"><span>${item.label} · API key</span><input type="password" id="key-${key}" value="${escapeHtml(settings.apiKeys[key] || '')}" placeholder="Pega tu clave aquí" autocomplete="off" /></label>`).join('')}</div><div class="modal-actions"><button class="secondary-button" id="clear-keys">Borrar claves</button><button class="generate-button small" id="save-settings">Guardar configuración</button></div></div></div>`;
}

function showToast(message, kind = '') {
  const toast = document.querySelector('#toast');
  toast.textContent = message;
  toast.className = `toast visible ${kind}`;
  window.clearTimeout(showToast.timer);
  showToast.timer = window.setTimeout(() => { toast.className = 'toast'; }, 2800);
}

function bindEvents() {
  document.querySelectorAll('.chip').forEach((chip) => chip.addEventListener('click', () => { document.querySelector('#instruction').value = chip.dataset.prompt; document.querySelector('#instruction').focus(); }));
  document.querySelector('#provider').addEventListener('change', (event) => {
    settings.provider = event.target.value;
    settings.model = PROVIDERS[settings.provider].defaultModel;
    saveSettings(settings);
    render();
  });
  document.querySelector('#model').addEventListener('change', (event) => { settings.model = event.target.value; saveSettings(settings); });
  document.querySelector('#language').addEventListener('change', (event) => { settings.language = event.target.value; saveSettings(settings); });
  document.querySelector('#output-type').addEventListener('change', (event) => { settings.outputType = event.target.value; saveSettings(settings); });
  document.querySelector('#generate-button').addEventListener('click', handleGenerate);
  document.querySelector('#instruction').addEventListener('keydown', (event) => { if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') handleGenerate(); });
  document.querySelector('#settings-button').addEventListener('click', () => { document.querySelector('#settings-modal').hidden = false; });
  document.querySelector('#close-settings').addEventListener('click', closeSettings);
  document.querySelector('#settings-modal').addEventListener('click', (event) => { if (event.target.id === 'settings-modal') closeSettings(); });
  document.querySelector('#settings-provider').addEventListener('change', (event) => { settings.provider = event.target.value; settings.model = PROVIDERS[settings.provider].defaultModel; });
  document.querySelector('#save-settings').addEventListener('click', () => {
    Object.keys(PROVIDERS).forEach((key) => { settings.apiKeys[key] = document.querySelector(`#key-${key}`).value.trim(); });
    settings.model = PROVIDERS[settings.provider].defaultModel;
    saveSettings(settings);
    closeSettings();
    render();
    showToast('Configuración guardada en este dispositivo');
  });
  document.querySelector('#clear-keys').addEventListener('click', () => { Object.keys(PROVIDERS).forEach((key) => { document.querySelector(`#key-${key}`).value = ''; }); });
  document.querySelectorAll('.file-item').forEach((button) => button.addEventListener('click', () => { activeFileIndex = Number(button.dataset.fileIndex); render(); }));
  document.querySelectorAll('.history-item').forEach((button) => button.addEventListener('click', () => { const item = history[Number(button.dataset.historyIndex)]; currentResult = item.result; activeFileIndex = 0; document.querySelector('#instruction').value = item.instruction; render(); showToast('Generación recuperada del historial'); }));
  document.querySelector('#copy-button')?.addEventListener('click', copyActiveFile);
  document.querySelector('#download-button')?.addEventListener('click', downloadActiveFile);
  document.querySelector('#export-button')?.addEventListener('click', exportProject);
  document.querySelector('#new-button')?.addEventListener('click', () => { currentResult = null; activeFileIndex = 0; render(); document.querySelector('#instruction').focus(); });
}

function closeSettings() { document.querySelector('#settings-modal').hidden = true; }

async function handleGenerate() {
  const instruction = document.querySelector('#instruction').value.trim();
  if (!instruction) { showToast('Escribe una instrucción primero', 'error'); document.querySelector('#instruction').focus(); return; }
  const button = document.querySelector('#generate-button');
  button.disabled = true;
  button.classList.add('loading');
  button.querySelector('span:nth-child(2)').textContent = hasApiKey(settings) ? 'Consultando IA…' : 'Preparando demo…';
  try {
    currentResult = await generateCode({ instruction, language: settings.language, outputType: settings.outputType, settings });
    activeFileIndex = 0;
    history.unshift({ title: currentResult.title, instruction, languageLabel: LANGUAGES.find((item) => item.value === settings.language)?.label || settings.language, result: currentResult, createdAt: Date.now() });
    persistHistory();
    render();
    showToast(currentResult.demo ? 'Demo local lista · configura una API para IA real' : 'Código generado correctamente');
  } catch (error) {
    button.disabled = false;
    button.classList.remove('loading');
    button.querySelector('span:nth-child(2)').textContent = 'Generar código';
    showToast(error.message || 'No se pudo generar el código', 'error');
  }
}

async function copyActiveFile() {
  const file = currentResult?.files?.[activeFileIndex];
  if (!file) return;
  await navigator.clipboard.writeText(file.code);
  showToast('Código copiado');
}

function downloadActiveFile() {
  const file = currentResult?.files?.[activeFileIndex];
  if (!file) return;
  const blob = new Blob([file.code], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const link = Object.assign(document.createElement('a'), { href: url, download: file.name });
  link.click();
  URL.revokeObjectURL(url);
  showToast(`${file.name} descargado`);
}

function exportProject() {
  if (!currentResult) return;
  const blob = new Blob([JSON.stringify(currentResult, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const link = Object.assign(document.createElement('a'), { href: url, download: 'code-mobile-project.json' });
  link.click();
  URL.revokeObjectURL(url);
  showToast('Proyecto exportado');
}

try {
  render();
} catch (error) {
  console.error('[Code Mobile] Error de arranque:', error);
  showStartupError(error);
}

  </script>
</body>
</html>
